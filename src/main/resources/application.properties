spring.application.name=smarthhealth
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:}
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
nhs.api.base-url=${NHS_API_BASE_URL:https://api.nhs.uk}
nhs.api.subscription-key=${NHS_API_KEY:}
nhs.api.api-version=${NHS_API_VERSION:2}
nhs.api.search-path=${NHS_API_SEARCH_PATH:/search}
nhs.api.query-parameter=${NHS_API_QUERY_PARAMETER:query}
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./backend/.env.admin[.properties],optional:file:./.env[.properties],optional:file:./.env.admin[.properties]
